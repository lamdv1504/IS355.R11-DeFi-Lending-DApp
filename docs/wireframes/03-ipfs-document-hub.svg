<text x="24" y="1067" font-size="12" fill="#61736f" font-weight="400">Chưa kết nối giao dịch.</text>
<text x="280" y="35" font-size="12" fill="#147d6c" font-weight="700">DEFI LENDING / L01</text>
<text x="280" y="78" font-size="30" fill="#183735" font-weight="700">IPFS Document &amp; Credit Hub</text>
<text x="280" y="104" font-size="14" fill="#61736f" font-weight="400">Tra cứu hồ sơ, kiểm tra quyền và tải tài liệu theo CID.</text>
<rect x="1190" y="40" width="150" height="30" rx="15" fill="#e7f3ee" stroke="#e7f3ee"/>
<text x="1202" y="60" font-size="12" fill="#147d6c" font-weight="700">Local · 31337</text>
