<text x="735" y="401" font-size="14" fill="#183735" font-weight="400">Riêng tư · Của tôi</text>
<text x="957" y="401" font-size="14" fill="#183735" font-weight="400">Xem / Tải</text>
<line x1="302" y1="444" x2="1107" y2="444" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round"/>
<text x="302" y="467" font-size="14" fill="#183735" font-weight="400">Audit Logs tháng mẫu</text>
<text x="602" y="467" font-size="14" fill="#183735" font-weight="400">JSON</text>
<text x="735" y="467" font-size="14" fill="#183735" font-weight="400">Công khai</text>
<text x="957" y="467" font-size="14" fill="#183735" font-weight="400">Xem / Tải</text>
<text x="302" y="531" font-size="13" fill="#61736f" font-weight="400">CID: lấy từ backend / on-chain khi có dữ liệu thật.</text>
<text x="302" y="554" font-size="13" fill="#61736f" font-weight="400">Không hiển thị hồ sơ riêng tư của ví khác trong danh sách.</text>
<rect x="1154" y="196" width="412" height="380" rx="12" fill="#ffffff" stroke="#d6e0dc"/>
<text x="1176" y="230" font-size="19" fill="#183735" font-weight="700">Tra cứu / Retrieve theo CID</text>
<rect x="1176" y="274" width="368" height="45" rx="7" fill="#f4f7f5" stroke="#d6e0dc"/>
<text x="1190" y="303" font-size="15" fill="#183735" font-weight="400">Nhập CID hợp lệ</text>
<text x="1176" y="352" font-size="13" fill="#183735" font-weight="400">Loại hồ sơ: tự nhận diện từ metadata</text>
<rect x="1176" y="377" width="368" height="42" rx="8" fill="#147d6c" stroke="#147d6c"/>
<text x="1191" y="404" font-size="14" fill="#ffffff" font-weight="700">Kiểm tra quyền &amp; tải tài liệu</text>
<text x="1176" y="459" font-size="13" fill="#61736f" font-weight="400">1. Kiểm tra CID và phiên đăng nhập</text>
<text x="1176" y="487" font-size="13" fill="#61736f" font-weight="400">2. Backend xác minh chủ hồ sơ / Admin</text>
<text x="1176" y="515" font-size="13" fill="#61736f" font-weight="400">3. Nhận nội dung được phép truy cập</text>
<text x="1176" y="543" font-size="13" fill="#61736f" font-weight="400">4. Kiểm tra hash và mở / tải file</text>
<rect x="280" y="600" width="850" height="260" rx="12" fill="#ffffff" stroke="#d6e0dc"/>
<text x="302" y="634" font-size="19" fill="#183735" font-weight="700">Chi tiết Loan Agreement #1</text>
<text x="302" y="658" font-size="12" fill="#61736f" font-weight="400">Chỉ hiện sau khi truy cập được phép</text>
<text x="302" y="698" font-size="13" fill="#61736f" font-weight="400">Ví chủ hồ sơ: 0x3C44…93BC · Khoản vay: #1 · Số tiền: 500.00 MyUSDT</text>
<text x="302" y="726" font-size="13" fill="#61736f" font-weight="400">CID / SHA-256: lấy từ tài liệu Q03 khi được tạo.</text>
<text x="302" y="754" font-size="13" fill="#61736f" font-weight="400">Trước vay: trạng thái Chờ giao dịch; trường txHash chưa có.</text>
<text x="302" y="782" font-size="13" fill="#61736f" font-weight="400">Sau receipt thành công: hiển thị txHash và liên kết explorer nếu là Sepolia.</text>
<text x="302" y="810" font-size="13" fill="#61736f" font-weight="400">Các ví không được cấp quyền không nhận nội dung giải mã hoặc khóa.</text>
<rect x="1154" y="600" width="412" height="260" rx="12" fill="#ffffff" stroke="#d6e0dc"/>
<text x="1176" y="634" font-size="19" fill="#183735" font-weight="700">Trạng thái truy cập</text>
<text x="1176" y="681" font-size="13" fill="#61736f" font-weight="400">401 · Cần kết nối ví và ký đăng nhập</text>
<text x="1176" y="711" font-size="13" fill="#61736f" font-weight="400">403 · Bạn không có quyền xem hồ sơ</text>
<text x="1176" y="741" font-size="13" fill="#61736f" font-weight="400">Đang tải · Lỗi gateway · Thử lại</text>
<text x="1176" y="771" font-size="13" fill="#61736f" font-weight="400">Sai hash · Dừng mở tài liệu</text>
<text x="1176" y="801" font-size="13" fill="#61736f" font-weight="400">Không có hồ sơ · Hiển thị trạng thái rỗng</text>
<rect x="280" y="884" width="1286" height="168" rx="12" fill="#ffffff" stroke="#d6e0dc"/>
<text x="302" y="918" font-size="19" fill="#183735" font-weight="700">Phân quyền trên giao diện</text>
<text x="302" y="953" font-size="13" fill="#61736f" font-weight="400">Khách / Lender: xem Audit Logs công khai. Borrower: thêm hồ sơ của chính mình. Admin: theo quyền backend cấp.</text>
<text x="302" y="981" font-size="13" fill="#61736f" font-weight="400">Ký đăng nhập là ký thông điệp, không tốn gas. Thay đổi ví hoặc mạng sẽ xóa phiên và làm mới danh sách.</text>
<text x="302" y="1009" font-size="13" fill="#61736f" font-weight="400">Biết CID không đồng nghĩa được đọc bản giải mã. Nút Retrieve vẫn kiểm tra quyền ở backend.</text>
