<text x="296" y="157" font-size="13" fill="#147d6c" font-weight="400">WIREFRAME · Snapshot minh họa theo HI01 · APR on-chain / APY quy đổi tham khảo</text>
<line x1="280" y1="1075" x2="1566" y2="1075" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round"/>
<text x="280" y="1100" font-size="12" fill="#61736f" font-weight="400">L01 / H01 + HI01 đã có · API bổ sung chờ xác nhận Q05 · Xem docs/ui_wireframes.md</text>
<rect x="280" y="196" width="850" height="380" rx="12" fill="#ffffff" stroke="#d6e0dc"/>
<text x="302" y="230" font-size="19" fill="#183735" font-weight="700">Hồ sơ của tôi &amp; dữ liệu công khai</text>
<text x="302" y="254" font-size="12" fill="#61736f" font-weight="400">Bộ lọc: Tất cả / Loan Agreement / Credit Report / Audit Logs</text>
<text x="302" y="292" font-size="12" fill="#61736f" font-weight="700">HỒ SƠ</text>
<text x="602" y="292" font-size="12" fill="#61736f" font-weight="700">ĐỊNH DẠNG</text>
<text x="735" y="292" font-size="12" fill="#61736f" font-weight="700">QUYỀN</text>
<text x="957" y="292" font-size="12" fill="#61736f" font-weight="700">THAO TÁC</text>
<line x1="302" y1="312" x2="1107" y2="312" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round"/>
<text x="302" y="335" font-size="14" fill="#183735" font-weight="400">Loan Agreement #1</text>
<text x="602" y="335" font-size="14" fill="#183735" font-weight="400">PDF</text>
<text x="735" y="335" font-size="14" fill="#183735" font-weight="400">Riêng tư · Của tôi</text>
<text x="957" y="335" font-size="14" fill="#183735" font-weight="400">Xem / Tải</text>
