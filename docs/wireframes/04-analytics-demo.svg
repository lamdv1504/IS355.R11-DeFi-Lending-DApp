<text x="302" y="988" font-size="13" fill="#61736f" font-weight="400">Demo thanh lý riêng: giữ nợ 500, giảm định giá từ 1,000 xuống 600 → HF 0.96 → ví liquidator approve rồi ký.</text>
<text x="302" y="1015" font-size="13" fill="#61736f" font-weight="400">Sepolia: ẩn/vô hiệu hóa tua thời gian và mock giá. Thiếu RPC / quyền / contract: chặn thao tác tương ứng.</text>
